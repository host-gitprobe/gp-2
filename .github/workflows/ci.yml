name: CI
on:
  pull_request_target:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Report PR title
        run: |
          echo "Reviewing PR titled: ${{ github.event.pull_request.title }}"
      - name: Run tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q
